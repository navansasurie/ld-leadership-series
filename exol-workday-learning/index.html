if(view==='learners'){const all=assignments().filter(a=>siteFilter==='All sites'||a.learner.site===siteFilter),complete=all.filter(a=>a.status==='Completed').length;out=head('WORKFORCE LEARNING OPERATIONS','Learner Assignment & Completion','Demonstrate how role, site and worker type determine eligibility. Mark completions and see readiness update immediately.')+'<div class="card"><div class="card-head"><label style="min-width:220px">Site filter<select id="siteFilter">'+option(['All sites',...SITES],siteFilter)+'</select></label><div class="actions">'+button('Export assignment CSV','export-assignments','outline')+button('Reset learner evidence','clear-completions','outline')+'</div></div><div class="metrics"><div class="metric"><strong>'+all.length+'</strong><span>Eligible assignments</span></div><div class="metric"><strong>'+complete+'</strong><span>Completed</span></div><div class="metric"><strong>'+all.filter(a=>a.status==='Overdue').length+'</strong><span>Overdue</span></div><div class="metric"><strong>'+(all.length?Math.round(complete/all.length*100):0)+'%</strong><span>Completion rate</span></div></div><div class="table-wrap"><table><thead><tr><th>Fictional learner</th><th>Role / site</th><th>Assigned course</th><th>Due date</th><th>Status</th><th>Evidence action</th></tr></thead><tbody>'+all.map(a=>'<tr><td><b>'+esc(a.learner.name)+'</b><br>'+esc(a.learner.id)+'</td><td>'+esc(a.learner.job)+'<br>'+esc(a.learner.site)+'</td><td>'+esc(course(a.rule.course)?.title||a.rule.course)+'</td><td>'+a.due+'</td><td>'+badge(a.status)+'</td><td>'+button(a.done?'Revoke demo completion':'Record demo completion','completion:'+a.learner.id+':'+a.rule.course,a.done?'outline':'yellow')+'</td></tr>').join('')+'</tbody></table></div></div><div class="notice">Assignments are calculated from simulated policies. Completion events are manually recorded as fictional evidence—not learner activity captured from Workday.</div>'}

function csv(name,rows){const data=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-action]');if(!b)return;if(b.dataset.view){view=b.dataset.view;filter='';edit=null;render();return}const a=b.dataset.action;if(['dashboard','catalog','builder','assignments','certifications','learners','interview','reports'].includes(a)){view=a;edit=null;filter='';render()}else if(a.startsWith('edit:')){edit=a.slice(5);view='builder';render()}else if(a.startsWith('publish:')){const c=course(a.slice(8));if(!c)return;if(!readiness(c)){notify('Complete four approval gates before publishing');view='catalog';filter='';render();return}if(!confirm('All four simulated approval gates are recorded. Publish this demo course?'))return;c.status='Published';log('Simulated publish: '+c.id);render();notify('Course status changed to Published (demo)')}else if(a.startsWith('approve:')){const c=course(a.slice(8));if(!c)return;const checked=pending(c);const body=GATES.map(g=>'['+(checked.includes(g)?'✓':' ')+'] '+g).join('\\n');const gate=prompt('APPROVAL GATES FOR '+c.id+' v'+c.version+'\\n'+body+'\\n\\nEnter a gate number (1–4) to record or revoke the simulated approval:');if(!gate)return;const idx=Number(gate)-1;if(idx<0||idx>3||!Number.isInteger(idx)){notify('Enter a number from 1 to 4');return}const g=GATES[idx];if(checked.includes(g)){db.approvals=db.approvals.filter(a=>!(a.course===c.id&&a.version===c.version&&a.gate===g));log('Revoked demo approval '+g+' for '+c.id)}else{db.approvals.push({course:c.id,version:c.version,gate:g,at:new Date().toISOString()});log('Recorded demo approval '+g+' for '+c.id)}render();notify(pending(c).length+'/4 approval gates recorded')}else if(a.startsWith('completion:')){const [lid,cid]=a.slice(11).split(':');const found=db.completions.findIndex(x=>x.learner===lid&&x.course===cid);if(found>=0){db.completions.splice(found,1);log('Revoked demo completion for '+lid+' / '+cid)}else{db.completions.push({learner:lid,course:cid,date:offset(0)});log('Recorded demo completion for '+lid+' / '+cid)}render()}else if(a==='clear-completions'){if(confirm('Clear all fictional completion records?')){db.completions=[];log('Cleared demo completion evidence');render()}}else if(a==='export-assignments'){csv('exol-demo-learner-assignments.csv',[['Learner ID','Learner','Job','Site','Course ID','Due','Status'],...assignments().map(a=>[a.learner.id,a.learner.name,a.learner.job,a.learner.site,a.rule.course,a.due,a.status])])}else if(a.startsWith('unpublish:')){const c=course(a.slice(10));c.status='Draft';log('Simulated unpublish: '+c.id);render()}else if(a.startsWith('toggle:')){const r=db.rules.find(x=>x.id===a.slice(7));r.active=!r.active;log('Rule '+r.id+' '+(r.active?'enabled':'disabled'));render()}else if(a.startsWith('renew:')){const c=db.certs.find(x=>x.id===a.slice(6));if(!confirm('Simulate verified renewal for '+c.person+'? No actual qualification is issued.'))return;c.expires=offset(365);c.status='Current';log('Simulated certification renewal: '+c.id);render();notify('Sample expiry extended by 365 days')}else if(a==='export-courses')csv('exol-demo-catalog.csv',[['ID','Title','Pillar','Language','Duration','Status','Version','Owner','Asset','Approval'],...db.courses.map(c=>[c.id,c.title,c.pillar,c.lang,c.duration,c.status,c.version,c.owner,c.asset,c.approval])]);else if(a==='export-rules')csv('exol-demo-rules.csv',[['ID','Course','Job','Site','Worker','Due days','Active'],...db.rules.map(r=>[r.id,r.course,r.job,r.site,r.worker,r.due,r.active])]);else if(a==='export-certs')csv('exol-demo-certifications.csv',[['ID','Worker','Job','Site','Certification','Expires','Status','Evidence'],...db.certs.map(c=>[c.id,c.person,c.job,c.site,c.name,c.expires,status(c),c.evidence])]);else if(a==='export-log')csv('exol-demo-audit.csv',[['Timestamp','Event'],...db.logs.map(l=>[l.at,l.event])]);else if(a==='print')window.print();else if(a==='reset'){if(confirm('Reset all locally saved fictional demo data?')){db=seed();save();render();notify('Demo data reset')}}});
document.addEventListener('change',e=>{if(e.target.id==='siteFilter'){siteFilter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;filter=e.target.value;render();const i=$('search');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(!['courseForm','ruleForm'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target);if(e.target.id==='courseForm'){const c={id:edit||'EX-'+String(Math.max(107,...db.courses.map(c=>Number(c.id.split('-')[1])||0))+1),title:String(f.get('title')).trim(),pillar:f.get('pillar'),lang:f.get('lang'),asset:f.get('asset'),duration:Number(f.get('duration')),version:f.get('version'),owner:String(f.get('owner')).trim(),approval:String(f.get('approval')).trim(),status:edit?course(edit).status:'Draft'};if(!c.title||!c.owner||!c.approval)return;if(edit){const old=course(edit);if(old&&old.version!==c.version){c.status='Draft';db.approvals=db.approvals.filter(a=>a.course!==edit);log('Version changed: approvals invalidated for '+edit)}db.courses=db.courses.map(x=>x.id===edit?c:x)}else db.courses.push(c);log((edit?'Updated':'Created draft')+' course '+c.id);edit=null;view='catalog';render();notify('Course metadata saved locally')}else{const id='AR-'+String(Math.max(0,...db.rules.map(x=>Number(x.id.split('-')[1])||0))+1).padStart(3,'0');db.rules.push({id,course:f.get('course'),job:f.get('job'),site:f.get('site'),worker:f.get('worker'),due:Number(f.get('due')),active:true});log('Created simulated assignment rule '+id);render();notify('Assignment policy saved (demo)')}});
render();
